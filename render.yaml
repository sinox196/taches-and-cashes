# Render blueprint. Kept for the test deployment; Railway is the intended
# production target and reads railway.json instead. Both get their database the
# same way — a managed PostgreSQL instance injecting DATABASE_URL — so the app
# is identical on either and can move between them with a dump and a restore.

databases:
  - name: taches-db
    databaseName: tachescash
    user: tachescash
    # Render's free PostgreSQL is deleted after 30 days. Fine for a test
    # deployment; move to a paid plan (or to Railway) before it holds real data.
    plan: free

services:
  - type: web
    name: taches-and-cashes
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Generated once by Render and kept stable across deploys — do not
      # remove/regenerate this, or every previously issued login token
      # becomes invalid.
      - key: JWT_SECRET
        generateValue: true
      # The whole point of the managed database: durable, transactional, and
      # backed up by the platform. Without it the app now refuses to start in
      # production rather than quietly running on a JSON file that has neither.
      - key: DATABASE_URL
        fromDatabase:
          name: taches-db
          property: connectionString
